<!DOCTYPE html>
<html>

<head>
    <title>My Results</title>
</head>

<body>

    <h2>My Results</h2>

    <table border="1">
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Date</th>
        </tr>

        {% for result in results %}
        <tr>
            <td>{{ result.subject.subject_name }}</td>
            <td>{{ result.score }}</td>
            <td>{{ result.exam_date }}</td>
        </tr>
        {% endfor %}

    </table>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</body>

</html>
